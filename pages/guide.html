<!DOCTYPE html>
<!--
  User Guide — rendered from the PAGES object near the bottom
  of this file. PAGES is the source of truth; everything above it is chrome.

  The block helpers (panel/step/item/split/fbox/sect/note/grid/flow) map one
  for one onto tournaq/lib/widgets/explainer/explainer_blocks.dart, so the copy
  here and the in-app explainer pages stay the same shape. Grown out of
  drafts/guide/guide-web-draft.html; edit this file now, not the draft.

  One block has no counterpart in the app yet: `opts`, the reference table on the
  eight "Setting up …" pages and the eight "Running a …" ones. Its rows are read
  straight off the app: tournaq/lib/pages/*_setup_page.dart for the setup fields
  (presets, defaults, clamps, footnotes, the help sheets behind the question marks),
  tournaq/lib/widgets/pills/ for the tournament page's pills (what each opens, and why
  it locks), and the scorecard pages plus lib/scoring/ for what each card offers.
  setup-options.md, tournament-options.md and scorecard-options.md in this repo hold
  the same data with the source files it came from; when the app changes, those three
  and these tables are what has to follow.
-->
